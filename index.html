<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spending Tracker</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 10px;
}

.container {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

label {
    font-weight: 600;
    display: block;
    margin-top: 10px;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-size: 16px;
}

.radio-group {
    display: flex;
    gap: 20px;
    margin-top: 5px;
}

.radio-group input {
    width: auto;
    transform: scale(1.2);
}

button {
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
}

#syncBtn {
    background: #28a745;
}

#totalAmount {
    font-weight: bold;
    font-size: 16px;
    margin: 10px 0;
    text-align: center;
}

#syncStatus {
    text-align: center;
    margin-top: 8px;
    font-size: 14px;
    min-height: 18px;
}

.table-wrapper {
    overflow-x: auto;
    margin-top: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 480px;
}

th, td {
    border: 1px solid #ddd;
    padding: 6px;
    font-size: 12px;
    text-align: center;
}

th {
    background: #007bff;
    color: #fff;
    position: sticky;
    top: 0;
}

td:nth-child(2) {
    font-weight: bold;
    text-align: right;
}

td:nth-child(3) {
    text-align: left;
}

.delete-btn {
    background: #dc3545;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
}

@media (max-width: 480px) {
    th, td {
        font-size: 11px;
        padding: 5px;
    }
}
</style>
</head>

<body>

<div class="container">
<h2>💰 Spending Tracker</h2>

<label>Date</label>
<div class="radio-group">
    <label><input type="radio" name="dateOption" checked onclick="setToday()"> Today</label>
    <label><input type="radio" name="dateOption" onclick="enableDatePicker()"> Pick another date</label>
</div>

<input type="date" id="datePicker" disabled>

<label>Amount (₹)</label>
<input type="number" id="amount" placeholder="Enter amount">

   
<label>Description</label>
<input type="text" id="desc" placeholder="Eg: Grocery, Petrol">
 
    
<button onclick="addExpense()">Add Expense</button>

<!-- Total Amount Display -->
<div id="totalAmount">Total: ₹0</div>

<button id="syncBtn" onclick="manualSync()">🔄 Sync</button>

<div id="syncStatus"></div>

<div class="table-wrapper">
<table>
<thead>
<tr>
    <th>Date</th>
    <th>Amount</th>
    <th>Description</th>
    <th>X</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<script>
setInterval(manualSync, 8000);
const API_URL = "https://script.google.com/macros/s/AKfycbxMK4jwN1TmcMCx_NYyYggRqm7LN52GuTuOTrSNEMOBTK20RJo9jKiAEJ7fwMX6Qe05/exec";

// -----------------------------
// Convert JS date string to dd-MMM-yyyy
// -----------------------------
function formatDateDisplay(dateStr) {
    const d = new Date(dateStr);
    const day = ("0" + d.getDate()).slice(-2);
    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun",
                        "Jul","Aug","Sep","Oct","Nov","Dec"];
    const month = monthNames[d.getMonth()];
    const year = d.getFullYear();
    return `${day}-${month}-${year}`;
}

// -----------------------------
// Set today in date picker
// -----------------------------
function formatDateInput(d) {
    return d.toISOString().split("T")[0];
}

function setToday() {
    const dp = document.getElementById("datePicker");
    dp.disabled = true;
    dp.value = formatDateInput(new Date());
}

function enableDatePicker() {
    const dp = document.getElementById("datePicker");
    dp.disabled = false;
    if (!dp.value) dp.value = formatDateInput(new Date());
}

// -----------------------------
// Show status messages
// -----------------------------
function showStatus(msg, success = true) {
    const status = document.getElementById("syncStatus");
    status.innerText = msg;
    status.style.color = success ? "green" : "red";
    setTimeout(() => status.innerText = "", 2000);
}

// -----------------------------
// Update total amount
// -----------------------------
function updateTotal(data) {
    const total = data.reduce((sum, row) => sum + parseFloat(row.amount), 0);
    document.getElementById("totalAmount").innerText = `Total: ₹${total}`;
}

// -----------------------------
// Render table
// -----------------------------
function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    data.forEach(row => {
        tbody.innerHTML += `
        <tr>
            <td>${formatDateDisplay(row.dateDisplay)}</td>
            <td>₹${row.amount}</td>
            <td>${row.desc}</td>
            <td>
                <button class="delete-btn"
                    onclick="deleteExpense(
                        '${row.dateRaw.replace(/'/g,"\\'")}',
                        '${row.amount}',
                        '${row.desc.replace(/'/g,"\\'")}'
                    )">✕</button>
            </td>
        </tr>`;
    });

    updateTotal(data);
}

// -----------------------------
// Sync with Google Sheet
// -----------------------------
async function manualSync() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderTable(data);
        showStatus("✔ Synced");
    } catch {
        showStatus("❌ Sync failed", false);
    }
}

// -----------------------------
// Add Expense
// -----------------------------
async function addExpense() {
    const dateInput = document.getElementById("datePicker").value;
    const amount = document.getElementById("amount").value;
    const desc = document.getElementById("desc").value.trim();

    if (!dateInput || !amount || !desc) {
        alert("Please fill all fields");
        return;
    }

    const dateDisplay = formatDateDisplay(dateInput);

    const confirmMsg =
`Add this expense?

Date: ${dateDisplay}
Amount: ₹${amount}
Description: ${desc}`;

    if (!confirm(confirmMsg)) return;

    const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ date: dateInput, amount, desc })
    });

    const text = await res.text();

    if (text === "Success") {
        showStatus("✔ Added");
        document.getElementById("amount").value = "";
        document.getElementById("desc").value = "";
        manualSync();
    } else {
        showStatus("❌ Add failed", false);
    }
}

// -----------------------------
// Delete Expense
// -----------------------------
async function deleteExpense(date, amount, desc) {
    if (!confirm("Delete this entry?")) return;

    const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ mode: "delete", date, amount, desc })
    });

    const text = await res.text();

    if (text === "Deleted") {
        showStatus("✔ Deleted");
        manualSync();
    } else {
        showStatus("❌ Delete failed", false);
    }
}

// -----------------------------
// INITIAL SETUP
// -----------------------------
setToday();
manualSync();

</script>

</body>
</html>
